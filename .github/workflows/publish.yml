name: Publish

on:
  push:
    tags: ["opencode-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: opencode

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          package-manager-cache: false
      - name: Verify release tag matches package version
        if: github.ref_type == 'tag'
        run: test "$GITHUB_REF_NAME" = "opencode-v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm publish
